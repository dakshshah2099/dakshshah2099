<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%">
  <defs>
    <linearGradient id="gt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#fb542b"/>
      <stop offset="100%" stop-color="#ff6b3d"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b3d"/>
      <stop offset="60%" stop-color="#fb542b"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

  </defs>

  <style>
    .t{fill:url(#gt);opacity:.28;transform-box:fill-box;transform-origin:center top}
    .b{fill:url(#gb);opacity:.28;transform-box:fill-box;transform-origin:center bottom}
    @keyframes e1{0%,100%{transform:scaleY(.08)}25%{transform:scaleY(.85)}50%{transform:scaleY(.2)}75%{transform:scaleY(.65)}}
    @keyframes e2{0%,100%{transform:scaleY(.12)}30%{transform:scaleY(.7)}55%{transform:scaleY(.3)}80%{transform:scaleY(.9)}}
    @keyframes e3{0%,100%{transform:scaleY(.15)}20%{transform:scaleY(.6)}45%{transform:scaleY(.1)}70%{transform:scaleY(.8)}}
    @keyframes e4{0%,100%{transform:scaleY(.1)}35%{transform:scaleY(.75)}60%{transform:scaleY(.15)}85%{transform:scaleY(.55)}}
    @keyframes e5{0%,100%{transform:scaleY(.18)}15%{transform:scaleY(.9)}40%{transform:scaleY(.25)}65%{transform:scaleY(.7)}}
    @keyframes e6{0%,100%{transform:scaleY(.06)}40%{transform:scaleY(.65)}70%{transform:scaleY(.1)}90%{transform:scaleY(.8)}}
    .a1{animation:e1 1.2s ease-in-out infinite}.a2{animation:e2 .9s ease-in-out infinite}
    .a3{animation:e3 1.5s ease-in-out infinite}.a4{animation:e4 1.1s ease-in-out infinite}
    .a5{animation:e5 1.35s ease-in-out infinite}.a6{animation:e6 .85s ease-in-out infinite}
  </style>

